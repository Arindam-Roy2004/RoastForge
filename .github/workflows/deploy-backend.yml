name: Build and Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

# Don't cancel in progress — interrupting a container swap can leave nothing running.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

defaults:
  run:
    working-directory: ./backend

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve image tags
        id: meta
        run: |
          repo="${{ secrets.DOCKERHUB_USERNAME }}/roasthub-backend"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "image=$repo:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          # SHA tag alongside latest, so a rollback has something to point at.
          tags: |
            ${{ steps.meta.outputs.repo }}:latest
            ${{ steps.meta.outputs.repo }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE
          script: |
            set -euo pipefail

            CONTAINER=roasthub-api
            ENV_FILE=/root/app/backend/.env

            # By image ID, not tag — :latest already points at the new build.
            PREVIOUS_IMAGE="$(docker inspect --format='{{.Image}}' "$CONTAINER" 2>/dev/null || echo '')"
            echo "Currently serving: ${PREVIOUS_IMAGE:-<nothing>}"
            echo "Deploying: $IMAGE"

            echo "${{ secrets.DOCKERHUB_TOKEN }}" \
              | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # Pull before stopping anything, so a failed pull costs no downtime.
            docker pull "$IMAGE"

            start_container() {
              docker run -d --name "$CONTAINER" --restart unless-stopped \
                --env-file "$ENV_FILE" \
                -p 127.0.0.1:5000:5000 \
                "$1"
            }

            # Loopback bind: reachable only through Nginx (infra/nginx/roasthub.conf).
            docker stop "$CONTAINER" 2>/dev/null || true
            docker rm "$CONTAINER" 2>/dev/null || true
            start_container "$IMAGE"

            # Gate on readiness, not liveness — the port opens before Mongo connects.
            echo "Waiting for readiness..."
            READY=0
            for attempt in $(seq 1 30); do
              if curl --fail --silent --max-time 3 http://127.0.0.1:5000/health/ready > /dev/null; then
                READY=1
                echo "Ready after ${attempt} attempt(s)."
                break
              fi
              sleep 2
            done

            if [ "$READY" -ne 1 ]; then
              echo "::error::New container failed readiness check. Rolling back."
              docker logs --tail 50 "$CONTAINER" || true
              docker stop "$CONTAINER" 2>/dev/null || true
              docker rm "$CONTAINER" 2>/dev/null || true

              if [ -n "$PREVIOUS_IMAGE" ]; then
                echo "Restoring $PREVIOUS_IMAGE"
                start_container "$PREVIOUS_IMAGE"
                if curl --fail --silent --max-time 3 --retry 10 --retry-delay 2 \
                     http://127.0.0.1:5000/health/ready > /dev/null; then
                  echo "Rollback healthy. Previous version is serving."
                else
                  echo "::error::Rollback did NOT become healthy. Service is down."
                fi
              else
                echo "::error::No previous container to roll back to. Service is down."
              fi
              # Fail the run even if the rollback worked — the deploy didn't happen.
              exit 1
            fi

            # Only after success, so the rollback target isn't pruned.
            docker image prune -f --filter "until=168h" || true
            echo "Deploy complete: $IMAGE"
