# Shared proxy settings. Included by every location in roasthub.conf so the
# headers don't drift between copies.
#
# Install: /etc/nginx/snippets/roasthub-proxy.conf

proxy_pass http://roasthub_api;
proxy_http_version 1.1;

# Overwrite rather than append ($proxy_add_x_forwarded_for). The free-roast limit
# is keyed purely on IP, so a client that can prepend its own XFF entry gets
# unlimited Gemini calls. Overwriting makes that impossible regardless of the
# trust-proxy hop count. There's only one hop here, so no chain is lost.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header Host $host;

# Needed for upstream keepalive; without it nginx sends Connection: close.
proxy_set_header Connection "";

proxy_connect_timeout 5s;
proxy_send_timeout 65s;

# Gemini calls are synchronous and can exceed nginx's 60s default, which shows up
# as a 504 on a request that's actually still succeeding upstream.
proxy_read_timeout 120s;
