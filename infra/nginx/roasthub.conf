# Reverse proxy for the RoastHub API.
#
# Install:
#   /etc/nginx/sites-available/roasthub.conf  (symlink into sites-enabled/)
#   /etc/nginx/snippets/roasthub-proxy.conf   (from infra/nginx/snippets/)
#   nginx -t && systemctl reload nginx
#
# The container binds 127.0.0.1:5000, so without this the API isn't reachable at
# all. Certificates are managed by certbot.
#
# Needs nginx >= 1.25.1 for `http2 on`; older builds use `listen 443 ssl http2`.

# Coarse outer shell in front of the app's own Upstash-backed limiters — drops a
# flood before it costs an event-loop slot or an Upstash round trip.
limit_conn_zone $binary_remote_addr zone=roasthub_conn:10m;
limit_req_zone  $binary_remote_addr zone=roasthub_req:10m rate=30r/s;

# Both modules default to 503. The app answers its own rate limits with 429, and
# /health/ready uses 503 for "not ready", so keep those meanings distinct.
limit_req_status 429;
limit_conn_status 429;

upstream roasthub_api {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.roasthub.example;

    # Must stay on plain HTTP or renewal fails.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.roasthub.example;

    ssl_certificate     /etc/letsencrypt/live/api.roasthub.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.roasthub.example/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # No ssl_stapling: Let's Encrypt retired OCSP in Aug 2025 and current certs
    # carry no OCSP URL, so it only logs a warning on reload.

    # Auth depends on this — cookies are Secure/SameSite=None in production.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    server_tokens off;

    # Matches express.json({ limit: "2mb" }). Raised on the upload path below.
    client_max_body_size 2m;

    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;
    # Every response here is proxied, so the default would skip all of them.
    gzip_proxied any;

    # Limits are per-location, not server-level: neither limit_req nor limit_conn
    # accepts `off`, and both are inherited by any location that doesn't set its
    # own — which would throttle the health endpoints and cause false rollbacks.
    location / {
        limit_conn roasthub_conn 20;
        limit_req  zone=roasthub_req burst=60 nodelay;

        include snippets/roasthub-proxy.conf;
    }

    # /upload/resume and /upload/avatar go through multer at up to
    # UPLOAD_MAX_BYTES (10MB), so the 2m default would 413 them. 11m leaves room
    # for multipart overhead so multer rejects oversize files with clean JSON
    # instead of nginx returning HTML. (/upload/sign/resume is JSON-only — the
    # browser uploads straight to Cloudinary.)
    location /api/upload/ {
        client_max_body_size 11m;

        limit_conn roasthub_conn 20;
        limit_req  zone=roasthub_req burst=60 nodelay;

        include snippets/roasthub-proxy.conf;
    }

    # Health endpoints are unlimited so a throttled probe can't look like an outage.
    location = /health {
        access_log off;
        include snippets/roasthub-proxy.conf;
    }

    location = /health/ready {
        access_log off;
        include snippets/roasthub-proxy.conf;
    }
}
